<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Inter+Tight:wght@900&display=swap" rel="stylesheet">

    <link rel="icon" href="https://www.eurovision.com/static/images/70-heart-sm.ff9bba532601.webp" type="image/webp">

            --bg-deep: #0a021a; --accent-pink: #ff007f; --accent-cyan: #00f5ff; --accent-acid: #ccff00;

        }
        body { 
            background: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; letter-spacing: -0.02em; 
            background-image: linear-gradient(to bottom, rgba(10, 2, 26, 0.8), rgba(10, 2, 26, 0.95)), url('https://storage.googleapis.com/eurovision-com.appspot.com/renditions/public/cms/newwebsite_70png/NewWebsite_70-fill_size%3D1600x900-fill_size%3D1600x900.png');
            background-attachment: fixed; background-size: cover; background-position: center;
        }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://grainy-gradients.vercel.app/noise.svg'); opacity: 0.05; pointer-events: none; z-index: 9999; }

        .hero-view { min-height: 100vh; display: flex; flex-direction: column; padding: 40px; box-sizing: border-box; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-70 { height: 40px; }
        .logo { font-family: 'Inter Tight', sans-serif; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; color: #fff; margin: 0; }
        .logo span { color: var(--accent-pink); }
        #clock { font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--accent-cyan); font-weight: 900; }

        .timers-hero { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 80px; }
        .timer-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; backdrop-filter: blur(10px); text-decoration: none; }
        .timer-poster { width: 100%; aspect-ratio: 16/9; background-size: cover; background-position: center; border-bottom: 1px solid var(--glass-border); }
        .timer-info { padding: 15px 20px; background: rgba(0,0,0,0.4); }
        .timer-val { font-family: 'Inter Tight', sans-serif; font-size: 1.5rem; font-weight: 900; color: #fff; display: block; }
        .timer-label { font-size: 0.55rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.1em; opacity: 0.7; }

        .layout { display: grid; grid-template-columns: 350px 1fr 400px; gap: 40px; align-items: start; }
        .column { display: flex; flex-direction: column; gap: 30px; }
        .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 25px; backdrop-filter: blur(15px); position: relative; }

        /* FULL POST CARDS WITH HEARTS */
        .full-post-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); border-radius: 12px; padding: 40px; margin-bottom: 50px; line-height: 1.8; }
        .full-post-meta { font-size: 0.65rem; color: var(--accent-pink); font-weight: 900; text-transform: uppercase; margin-bottom: 25px; display: block; letter-spacing: 0.1em; }
        .post-title-wrapper { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }
        .post-heart { width: 45px; height: auto; flex-shrink: 0; }
        .full-post-body { font-size: 1.05rem; color: #ccc; white-space: pre-wrap; }
        .full-post-body b { color: #fff; font-weight: 900; }
        .full-post-body hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 30px 0; }
        .full-post-footer { margin-top: 40px; padding-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; font-weight: 900; }

        /* PLAYER & HISTORY */
        .player-cover { width: 100%; aspect-ratio: 1; border-radius: 12px; background-size: cover; background-position: center; background-image: url('https://myradio24.com/users/levdanskiy/cover.jpg'); margin-bottom: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
        .player-artist { font-weight: 900; font-size: 1.2rem; display: block; color: #fff; text-align: center; }
        .player-song { font-size: 0.9rem; color: var(--accent-cyan); font-weight: 700; margin-top: 6px; text-align: center; display: block; }
        .main-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .play-btn { background: #fff; border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .volume-slider { width: 100%; height: 4px; appearance: none; background: rgba(255,255,255,0.1); border-radius: 2px; margin-bottom: 15px; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; }
        
        .history-item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hist-cover { width: 45px; height: 45px; border-radius: 6px; background-size: cover; background-position: center; flex-shrink: 0; background-color: #111; border: 1px solid rgba(255,255,255,0.1); }
        .hist-info { display: flex; flex-direction: column; gap: 2px; }
        .hist-time { font-size: 0.6rem; color: var(--accent-pink); font-weight: 900; }
        .hist-song { font-size: 0.75rem; color: #eee; font-weight: 700; line-height: 1.2; }

        /* MISC */
        .heart-icon { width: 45px; height: auto; margin-right: 15px; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .scoreboard-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .badge { font-size: 0.6rem; font-weight: 900; padding: 4px 8px; border-radius: 3px; text-transform: uppercase; margin-left: auto; }
        
        #news-wire-title { font-size: 1.5rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--accent-pink); margin-bottom: 30px; }
        .news-item { margin-bottom: 30px; border-left: 2px solid rgba(255,0,127,0.3); padding-left: 15px; }
        .news-date { font-size: 0.65rem; color: var(--accent-pink); font-weight: 900; display: block; margin-bottom: 5px; }
        .news-title-link { display: flex; align-items: center; text-decoration: none; color: #fff; margin-bottom: 5px; }
        .news-heart { width: 24px; height: auto; margin-right: 10px; }
    </style>
</head>

                {d: "21.03 | 18:00", t: "🥐 ALMANAC: КАРДАМОН", u: "https://t.me/almanac_marginalia/3"},
                {d: "21.03 | 20:00", id: "hr", t: "🧬 DNA: CROATIA - LELEK", u: "https://t.me/YourEurovision/5471"}
            ],
            fullPosts: [
                {

                },
                {

                    t: "🥐 ТЕКСТ №03 - ВОСКРЕСНАЯ ЭФФЕКТИВНОСТЬ",

                    b: "Воскресенье не создано для сложных конструкций. Это день «малых форм» - и в мыслях, и на кухне. Сегодня в архиве рецепт творожных лепешек (Biezpiena plācenīši), приготовленных на сковороде.<hr>• База: 250г сухого творога, 1 яйцо, 2 ложки рисовой муки.<br>• Нюанс: Добавьте цедру лимона или щепотку соли вместо сахара. Сахар мы добавим в конце, в виде капли меда.<hr>Подавать теплыми, на простой керамике. Идеальный финал для недели, которая требовала от нас слишком многого.",

        function getHeartUrl(id) { 
            if (id === "70") return "https://www.eurovision.com/static/images/70-heart-sm.ff9bba532601.webp";
            return `https://www.eurovision.com/static/images/flags/flag_${id}.svg`; 
        }

        function render() {
            document.getElementById('scoreboard-body').innerHTML = DATA.qualifiers.map(q => `<div class="scoreboard-row"><img src="${getHeartUrl(q.id)}" class="heart-icon"><b>${q.c.toUpperCase()}</b><span class="badge badge-qualified">Qualified</span></div>`).join('');
            document.getElementById('wildcard-body').innerHTML = DATA.wildcards.map(w => `<div class="scoreboard-row"><img src="${getHeartUrl(w.id)}" class="heart-icon"><b>${w.c.toUpperCase()}</b><span class="badge badge-second">2nd Chance</span></div>`).join('');
            document.getElementById('eliminated-body').innerHTML = DATA.eliminated.map(e => `<div class="scoreboard-row" style="opacity:0.5;"><img src="${getHeartUrl(e.id)}" class="heart-icon" style="filter:grayscale(100%);"><b>${e.c.toUpperCase()}</b><span class="badge" style="background:#444;">Eliminated</span></div>`).join('');
            document.getElementById('news-body').innerHTML = DATA.news.map(n => `<div class="news-item"><span class="news-date">${n.d}</span><a href="${n.u}" target="_blank" class="news-title-link">${n.id ? `<img src="${getHeartUrl(n.id)}" class="news-heart">` : ''}<span class="news-title">${n.t}</span></a></div>`).join('');
            
            document.getElementById('latest-posts-container').innerHTML = DATA.fullPosts.map(p => `
                <div class="full-post-card">
                    <span class="full-post-meta">${p.m}</span>
                    <div class="post-title-wrapper">
                        <img src="${getHeartUrl(p.id)}" class="post-heart">
                        <div class="section-title" style="border:none; padding:0; font-size:1.3rem; margin-bottom:0;">${p.t}</div>
                    </div>
                    <div class="full-post-body">${p.b}</div>
                    <div class="full-post-footer">⏱ ЧТЕНИЕ: 1.5 МИН | <a href="${p.u}" target="_blank" style="color:inherit">ОРИГИНАЛ В TELEGRAM</a></div>
                </div>
            `).join('');
        }

        var audio = document.getElementById('audio-stream');
        var cover = document.getElementById('player-cover');
        var playBtn = document.getElementById('toggle-play');

        playBtn.onclick = () => { if (audio.paused) { audio.src = "https://live.myradio24.com/levdanskiy?nocache="+Date.now(); audio.play(); } else { audio.pause(); } };
        document.getElementById('volume-slider').oninput = (e) => audio.volume = e.target.value;

        async function syncRadio() {
            try {
                const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://myradio24.com/users/levdanskiy/status.json?v=' + Date.now()));
                const data = JSON.parse((await res.json()).contents);
                const s = data.song || (data.songs && data.songs.length ? data.songs[data.songs.length-1].song : "YourVision - Radio");
                document.getElementById('radio-artist').innerText = s.split(' - ')[0];
                document.getElementById('radio-song').innerText = s.split(' - ')[1];
                const rawImg = data.imgbig || (data.songs && data.songs.length ? data.songs[0].img : "");
                const img = (!rawImg || rawImg.includes('nocover')) ? `https://www.eurovision.com/static/images/70-heart-sm.ff9bba532601.webp` : `https://myradio24.com/${rawImg}`;
                cover.style.backgroundImage = `url('${img}')`;
                
                document.getElementById('history-list').innerHTML = data.songs.slice(0,10).map(h => `
                    <div class="history-item">
                        <div class="hist-cover" style="background-image:url('https://myradio24.com/${h.img}')"></div>
                        <div class="hist-info"><span class="hist-time">${h.time}</span><span class="hist-song">${h.song}</span></div>
                    </div>
                `).join('');
            } catch(e) {}
        }

        function update() {
            document.getElementById('clock').innerText = "RIGA: " + new Date().toLocaleTimeString('ru-RU');
            const now = new Date().getTime();
            for (let id in DATES) {
                const diff = DATES[id] - now;
                const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
                const el = document.getElementById('timer-' + id);
                if(el) el.innerText = `${d}d ${h}h ${m}m ${s}s`;
            }
        }

        setInterval(update, 1000); setInterval(syncRadio, 10000);
        update(); render(); syncRadio();
    </script>
</body>
</html>
