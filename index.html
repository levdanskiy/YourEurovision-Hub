<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourEurovision | Vienna 2026 Insider Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Inter+Tight:wght@900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: linear-gradient(180deg, #2e0b54 0%, #0a021a 100%); --accent-pink: #ff007f; --accent-cyan: #00f5ff; --accent-acid: #ccff00;
            --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #e0e0e0;
        }
        body { background: var(--bg-deep) fixed; color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; letter-spacing: -0.02em; }
        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('https://grainy-gradients.vercel.app/noise.svg'); opacity: 0.05; pointer-events: none; z-index: 9999; }
        nav { padding: 25px 60px; display: flex; justify-content: space-between; align-items: center; background: rgba(2, 4, 15, 0.8); backdrop-filter: blur(20px); border-bottom: 1px solid var(--glass-border); position: sticky; top: 0; z-index: 1000; }
        .logo { font-weight: 900; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; }
        .logo span { color: var(--accent-pink); }
        #clock { font-family: 'Inter Tight', sans-serif; font-size: 1.1rem; font-weight: 900; color: #fff; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0, 245, 255, 0.5); border-left: 3px solid var(--accent-cyan); padding-left: 15px; }

        .hero { height: 45vh; background: linear-gradient(180deg, rgba(2,4,15,0) 0%, rgba(2,4,15,1) 100%), url('assets/ESC_2026_GF.jpg'); background-size: cover; background-position: center; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero h1 { font-size: 5rem; font-weight: 900; text-transform: uppercase; margin: 0; line-height: 0.9; }
        .hero p { color: var(--accent-acid); font-family: 'Inter Tight', sans-serif; font-weight: 900; text-transform: uppercase; margin-top: 15px; letter-spacing: 2px; }

        .timers-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 0 60px; margin-top: -60px; margin-bottom: 60px; }
        .timer-card { background: var(--glass-bg); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-radius: 12px; overflow: hidden; text-align: center; }
        .timer-header-img { width: 100%; height: 120px; object-fit: cover; border-bottom: 2px solid var(--accent-pink); }
        .timer-body { padding: 20px; }
        .timer-label { font-family: 'Inter Tight', sans-serif; font-size: 0.7rem; text-transform: uppercase; color: var(--accent-cyan); font-weight: 900; margin-bottom: 5px; }
        .timer-value { font-size: 1.8rem; font-weight: 900; color: #fff; letter-spacing: -1px; }

        .layout-grid { display: grid; grid-template-columns: 400px 1fr 400px; gap: 40px; padding: 0 60px 60px 60px; max-width: 1800px; margin: 0 auto; }
        .column { display: flex; flex-direction: column; gap: 30px; }
        .card { background: var(--glass-bg); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 25px; }

        .player-cover { width: 100%; height: 300px; background: #111 url('https://myradio24.com/users/levdanskiy/nocover.jpg') center/cover no-repeat; border-radius: 8px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; transition: 0.5s; }
        .player-info { text-align: center; margin-bottom: 20px; min-height: 70px; }
        .player-artist { font-family: 'Inter Tight', sans-serif; font-size: 1.3rem; font-weight: 900; color: #fff; display: block; text-transform: uppercase; line-height: 1.1; }
        .player-song { font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--accent-cyan); opacity: 0.8; }
        .play-btn { background: var(--accent-pink); border: none; width: 60px; height: 60px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; margin: 0 auto; transition: 0.3s; }
        .play-btn:hover { transform: scale(1.1); box-shadow: 0 0 20px var(--accent-pink); }

        .section-title { font-size: 1.5rem; font-weight: 900; text-transform: uppercase; border-left: 6px solid var(--accent-pink); padding-left: 15px; margin-bottom: 25px; }
        .scoreboard-row { padding: 12px 0; border-bottom: 1px solid var(--glass-border); display: flex; justify-content: space-between; align-items: center; }
        .badge { font-family: 'Inter Tight', sans-serif; font-size: 0.6rem; padding: 4px 12px; border-radius: 2px; text-transform: uppercase; font-weight: 900; }
        .badge-qualified { background: var(--accent-pink); color: #fff; }
        .badge-second { border: 1px solid var(--accent-acid); color: var(--accent-acid); }

        .history-item { font-size: 0.75rem; color: #888; padding: 8px 0; border-bottom: 1px solid #111; display: flex; gap: 10px; }
        .history-time { font-family: 'Space Mono', monospace; color: var(--accent-pink); font-weight: 700; min-width: 45px; }

        .news-feed { max-height: 120vh; overflow-y: auto; scrollbar-width: none; }
        .news-header { font-family: 'Inter Tight', sans-serif; font-size: 0.9rem; font-weight: 900; text-transform: uppercase; border-bottom: 3px solid var(--accent-pink); padding-bottom: 10px; margin-bottom: 25px; display: flex; justify-content: space-between; }
        .news-item { margin-bottom: 25px; }
        .news-date { font-family: 'Inter Tight', sans-serif; font-size: 0.65rem; color: var(--accent-pink); display: block; margin-bottom: 5px; font-weight: 700; }
        .news-title { font-size: 1.1rem; font-weight: 900; text-transform: uppercase; line-height: 1.1; color: #fff; display: block; text-decoration: none; }
    </style>
    <script src="yv_news.js"></script>
</head>
<body>
    <nav><a href="https://t.me/YourEurovision" target="_blank" style="text-decoration:none; color:inherit;"><div class="logo">Your<span>Eurovision</span> / 2026</div></a><div id="clock">RIGA: 00:00:00</div></nav>
    <header class="hero"><h1>United By<br>Music</h1><p>// Vienna 2026 Insider Hub</p></header>
    <section class="timers-container">
        <div class="timer-card"><img src="assets/ESC_2026_SF1.jpg" class="timer-header-img"><div class="timer-body"><div class="timer-label">Semi-Final 01</div><div class="timer-value" id="timer-sf1">--d --h --m --s</div></div></div>
        <div class="timer-card"><img src="assets/ESC_2026_SF2.jpg" class="timer-header-img" style="border-color: var(--esc-cyan);"><div class="timer-body"><div class="timer-label">Semi-Final 02</div><div class="timer-value" id="timer-sf2">--d --h --m --s</div></div></div>
        <div class="timer-card"><img src="assets/ESC_2026_GF.jpg" class="timer-header-img" style="border-color: var(--esc-yellow);"><div class="timer-body"><div class="timer-label">Grand Final</div><div class="timer-value" id="timer-gf">--d --h --m --s</div></div></div>
    </section>
    <div class="layout-grid">
        <aside class="column">
            <div class="card">
                <div id="player-cover" class="player-cover"></div>
                <div class="player-info"><span class="player-artist" id="radio-artist">LEVDANSKIY</span><span class="player-song" id="radio-song">LIVE RADIO</span></div>
                <button id="toggle-play" class="play-btn">
                    <svg id="play-icon" viewBox="0 0 24 24" style="width:25px;fill:white;"><path d="M8 5v14l11-7z"/></svg>
                    <svg id="pause-icon" viewBox="0 0 24 24" style="display:none;width:25px;fill:white;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                </button>
                <input type="range" id="volume-slider" style="width:100%; margin-top:20px; -webkit-appearance:none; height:3px; background:#333; outline:none;" min="0" max="1" step="0.01" value="0.8">
                <audio id="audio-stream" preload="none"></audio>
            </div>
            <div class="card"><span class="section-title" style="font-size: 0.8rem; margin-bottom: 15px; display: block;">History (10)</span><div id="history-list"></div></div>
        </aside>
        <main class="column">
            <h2 class="section-title">Scoreboard</h2><div id="scoreboard-body" class="card"></div>
            <h2 class="section-title" style="border-color: var(--accent-cyan);">Second Chance</h2><div id="wildcard-body" class="card"></div>
        </main>
        <aside class="column news-feed">
            <div class="news-header"><span>[ Live_Feed ]</span><span style="color: var(--accent-pink);">● LIVE</span></div>
            <div id="news-body"></div>
        </aside>
    </div>
    <script>
        const DATES = { sf1: new Date('2026-05-12T22:00:00+02:00').getTime(), sf2: new Date('2026-05-14T22:00:00+02:00').getTime(), gf: new Date('2026-05-16T22:00:00+02:00').getTime() };
        const TOURNAMENT_STATE = {
            "qualifiers": [
                {"country": "Georgia", "group": "A"}, {"country": "Albania", "group": "A"},
                {"country": "Sweden", "group": "B"}, {"country": "United Kingdom", "group": "B"}
            ],
            "wildcards": [{"country": "Norway", "group": "A"}, {"country": "Bulgaria", "group": "B"}]
        };

        const audio = document.getElementById('audio-stream');
        const playBtn = document.getElementById('toggle-play');
        const cover = document.getElementById('player-cover');
        const artistEl = document.getElementById('radio-artist');
        const songEl = document.getElementById('radio-song');
        const historyList = document.getElementById('history-list');

        function updateTimers() {
            const now = new Date().getTime();
            Object.keys(DATES).forEach(id => {
                const diff = DATES[id] - now;
                const el = document.getElementById('timer-' + id);
                if (diff <= 0) { el.innerText = "LIVE!"; } else {
                    const d = Math.floor(diff / 86400000), h = Math.floor((diff / 3600000) % 24), m = Math.floor((diff / 60000) % 60), s = Math.floor((diff / 1000) % 60);
                    el.innerText = \`\${d}d \${h}h \${m}m \${s}s\`;
                }
            });
            document.getElementById('clock').innerText = "RIGA: " + new Date().toLocaleTimeString('ru-RU');
        }

        async function fetchCover(track) {
            const query = track.replace(/levdanskiy|live|radio|320|mp3/gi, '').trim();
            try {
                const res = await fetch(\`https://itunes.apple.com/search?term=\${encodeURIComponent(query)}&media=music&limit=1\`);
                const json = await res.json();
                if (json.results && json.results[0]) {
                    cover.style.backgroundImage = \`url('\${json.results[0].artworkUrl100.replace('100x100bb', '600x600bb')}')\`;
                } else { cover.style.backgroundImage = \`url('https://myradio24.com/users/levdanskiy/cover.jpg?v=\${new Date().getTime()}')\`; }
            } catch (e) { cover.style.backgroundImage = \`url('https://myradio24.com/users/levdanskiy/cover.jpg?v=\${new Date().getTime()}')\`; }
        }

        async function updateRadio() {
            try {
                // Прямой запрос к JSON (MyRadio24 часто разрешает CORS для этого пути)
                const res = await fetch('https://myradio24.com/json/levdanskiy');
                const data = await res.json();
                if (data && data.nowplaying) {
                    const parts = data.nowplaying.split(' - ');
                    artistEl.innerText = (parts[0] || "LEVDANSKIY").toUpperCase();
                    songEl.innerText = parts[1] || "LIVE RADIO";
                    fetchCover(data.nowplaying);
                    if (data.lastsongs) {
                        historyList.innerHTML = data.lastsongs.slice(0,10).map(s => \`<div class="history-item"><span class="history-time">\${s.time}</span><span>\${s.song}</span></div>\`).join('');
                    }
                }
            } catch (e) { 
                // Повторная попытка через прокси если прямой запрос не прошел
                const proxyRes = await fetch(\`https://api.allorigins.win/get?url=\${encodeURIComponent('https://myradio24.com/json/levdanskiy')}\`);
                const proxy = await proxyRes.json();
                const data = JSON.parse(proxy.contents);
                if (data && data.nowplaying) {
                    const parts = data.nowplaying.split(' - ');
                    artistEl.innerText = (parts[0] || "LEVDANSKIY").toUpperCase();
                    songEl.innerText = parts[1] || "LIVE RADIO";
                    fetchCover(data.nowplaying);
                    if (data.lastsongs) {
                        historyList.innerHTML = data.lastsongs.slice(0,10).map(s => \`<div class="history-item"><span class="history-time">\${s.time}</span><span>\${s.song}</span></div>\`).join('');
                    }
                }
            }
        }

        playBtn.onclick = () => {
            if (audio.paused) {
                const ts = new Date().getTime();
                audio.src = \`https://live.myradio24.com/levdanskiy?nocache=\${ts}\`;
                audio.load(); audio.play();
                document.getElementById('play-icon').style.display = 'none'; document.getElementById('pause-icon').style.display = 'block';
                updateRadio();
            } else {
                audio.pause(); audio.src = "";
                document.getElementById('play-icon').style.display = 'block'; document.getElementById('pause-icon').style.display = 'none';
            }
        };

        function refresh() {
            document.getElementById('scoreboard-body').innerHTML = TOURNAMENT_STATE.qualifiers.map(q => \`<div class="scoreboard-row"><span><b>\${q.country.toUpperCase()}</b></span><span class="badge badge-qualified">Qualified</span></div>\`).join('');
            document.getElementById('wildcard-body').innerHTML = TOURNAMENT_STATE.wildcards.map(w => \`\${w.country.toUpperCase()}, \`).join('').slice(0, -2);
            if (typeof YV_NEWS_DATA !== 'undefined') {
                document.getElementById('news-body').innerHTML = YV_NEWS_DATA.slice(0,10).map(n => \`<div class="news-item"><span class="news-date">\${n.date}</span><a href="\${n.url}" target="_blank" class="news-title">\${n.title}</a><p style="font-size:0.75rem; color:#777; line-height:1.4;">\${n.text}</p></div>\`).join('');
            }
        }
        setInterval(updateTimers, 1000); setInterval(updateRadio, 15000);
        updateTimers(); refresh();
    </script>
</body>
</html>
