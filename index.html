        }

        function render() {
            document.getElementById('scoreboard-body').innerHTML = DATA.qualifiers.map(q => `<div class="scoreboard-row"><img src="${getHeartUrl(q.id)}" class="heart-icon"><b>${q.c.toUpperCase()}</b><span class="badge badge-qualified">Qualified</span></div>`).join('');
            document.getElementById('wildcard-body').innerHTML = DATA.wildcards.map(w => `<div class="scoreboard-row"><img src="${getHeartUrl(w.id)}" class="heart-icon"><b>${w.c.toUpperCase()}</b><span class="badge badge-second">2nd Chance</span></div>`).join('');
            document.getElementById('eliminated-body').innerHTML = DATA.eliminated.map(e => `<div class="scoreboard-row" style="opacity:0.5;"><img src="${getHeartUrl(e.id)}" class="heart-icon" style="filter:grayscale(100%);"><b>${e.c.toUpperCase()}</b><span class="badge" style="background:#444;">Eliminated</span></div>`).join('');
            document.getElementById('news-body').innerHTML = DATA.news.map(n => `<div class="news-item"><span class="news-date">${n.d}</span><a href="${n.u}" target="_blank" class="news-title-link"><img src="${getHeartUrl(n.id)}" class="news-heart"><span class="news-title">${n.t}</span></a></div>`).join('');
            
            const cardHtml = p => {
                let body = p.b.replace(/🔵|🔴|🟡|🟢|🟣/g, `<img src="${getHeartUrl('70')}" class="inline-heart">`);
                return `<div class="post-card"><img src="${p.img}" class="post-img"><div class="post-content"><span class="post-meta">${p.m}</span><div class="post-title-row"><img src="${getHeartUrl(p.id)}" class="post-heart-sm"><a href="${p.u}" target="_blank" class="post-h">${p.t}</a></div><div class="post-b">${body}</div></div></div>`;
            };
            
            document.getElementById('grid-2-top').innerHTML = DATA.fullPosts.slice(0,2).map(cardHtml).join('');
            document.getElementById('grid-3-bottom').innerHTML = DATA.fullPosts.slice(2,5).map(cardHtml).join('');
        }

        var audio = document.getElementById('audio-stream');
        var cover = document.getElementById('player-cover');
        var playBtn = document.getElementById('toggle-play');

        playBtn.onclick = () => { if (audio.paused) { audio.src = "https://live.myradio24.com/levdanskiy?nocache="+Date.now(); audio.play(); } else { audio.pause(); } };
        document.getElementById('volume-slider').oninput = (e) => audio.volume = e.target.value;

        async function syncRadio() {
            try {
                const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://myradio24.com/users/levdanskiy/status.json?v=' + Date.now()));
                const data = JSON.parse((await res.json()).contents);
                const s = data.song || (data.songs && data.songs.length ? data.songs[data.songs.length-1].song : "YourVision - Radio");
                document.getElementById('radio-artist').innerText = s.split(' - ')[0];
                document.getElementById('radio-song').innerText = s.split(' - ')[1];
                const rawImg = data.imgbig || (data.songs && data.songs.length ? data.songs[0].img : "");
                const img = (!rawImg || rawImg.includes('nocover')) ? `https://www.eurovision.com/static/images/70-heart-sm.ff9bba532601.webp` : `https://myradio24.com/${rawImg}`;
                cover.style.backgroundImage = `url('${img}')`;
                document.getElementById('history-list').innerHTML = data.songs.slice(0,10).map(h => `<div class="history-item"><div class="hist-cover" style="background-image:url('https://myradio24.com/${h.img}')"></div><div class="hist-info"><span class="hist-time">${h.time}</span><span class="hist-song">${h.song}</span></div></div>`).join('');
            } catch(e) {}
        }

        function update() {
            document.getElementById('clock').innerText = "RIGA: " + new Date().toLocaleTimeString('ru-RU');
            const now = new Date().getTime();
            for (let id in DATES) {
                const diff = DATES[id] - now;
                const d = Math.floor(diff/86400000), h = Math.floor((diff%86400000)/3600000), m = Math.floor((diff%3600000)/60000), s = Math.floor((diff%60000)/1000);
                const el = document.getElementById('timer-' + id);
                if(el) el.innerText = `${d}d ${h}h ${m}m ${s}s`;
            }
        }

        setInterval(update, 1000); setInterval(syncRadio, 10000);
        update(); render(); syncRadio();
    </script>
</body>
</html>
