<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourEurovision | Vienna 2026 Insider Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Inter+Tight:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="icon" href="https://www.eurovision.com/static/images/70-heart-sm.ff9bba532601.webp" type="image/webp">
    <style>
        :root {
            --bg-deep: #0a021a; --accent-pink: #ff007f; --accent-cyan: #00f5ff; --accent-acid: #ccff00;
            --glass-bg: rgba(255, 255, 255, 0.03); --glass-border: rgba(255, 255, 255, 0.08); --text-main: #e0e0e0; --text-dim: #777;
        }
        body { 
            background: var(--bg-deep); color: var(--text-main); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; letter-spacing: -0.02em; 
            background-image: linear-gradient(to bottom, rgba(10, 2, 26, 0.8), rgba(10, 2, 26, 0.95)), url('https://storage.googleapis.com/eurovision-com.appspot.com/renditions/public/cms/newwebsite_70png/NewWebsite_70-fill_size%3D1600x900-fill_size%3D1600x900.png');
            background-attachment: fixed; background-size: cover; background-position: center;
        }
        .hero-view { min-height: 100vh; display: flex; flex-direction: column; padding: 40px; box-sizing: border-box; }
        nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 60px; }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-70 { height: 40px; }
        .logo { font-family: 'Inter Tight', sans-serif; font-size: 1.5rem; font-weight: 900; text-transform: uppercase; color: #fff; margin: 0; }
        .logo span { color: var(--accent-pink); }
        #clock { font-family: 'Inter', sans-serif; font-size: 0.9rem; color: var(--accent-cyan); font-weight: 900; }

        .layout { display: grid; grid-template-columns: 350px 1fr 400px; gap: 40px; align-items: start; }
        .column { display: flex; flex-direction: column; gap: 30px; }
        .card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 12px; padding: 25px; backdrop-filter: blur(15px); position: relative; }

        /* PLAYER V15.0 */
        .player-cover { 
            width: 100%; aspect-ratio: 1; border-radius: 12px; background-size: cover; background-position: center;
            background-image: url('https://myradio24.com/users/levdanskiy/cover.jpg');
            margin-bottom: 25px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);
            transition: background-image 0.5s ease-in-out, opacity 0.3s;
        }
        .player-artist { font-weight: 900; font-size: 1.2rem; display: block; color: #fff; text-align: center; text-transform: uppercase; }
        .player-song { font-size: 0.9rem; color: var(--accent-cyan); font-weight: 700; margin-top: 6px; text-align: center; display: block; }
        
        .timer-container { margin-top: 15px; }
        .progress-bg { width: 100%; height: 4px; background: rgba(255,255,255,0.05); border-radius: 2px; overflow: hidden; margin-bottom: 8px; }
        .progress-bar { width: 0%; height: 100%; background: var(--accent-pink); transition: width 1s linear; }
        .timer-text { font-size: 0.6rem; color: var(--text-dim); font-weight: 900; text-transform: uppercase; text-align: center; display: block; }

        .main-controls { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .play-btn { background: #fff; border: none; width: 55px; height: 55px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .play-btn:hover { transform: scale(1.1); background: var(--accent-cyan); }
        .volume-slider { width: 100%; height: 4px; appearance: none; background: rgba(255,255,255,0.1); border-radius: 2px; cursor: pointer; }
        .volume-slider::-webkit-slider-thumb { appearance: none; width: 12px; height: 12px; background: #fff; border-radius: 50%; }
        
        .order-btn { background: var(--accent-pink); color: #fff; padding: 10px 20px; border-radius: 30px; font-size: 0.7rem; font-weight: 900; text-decoration: none; text-transform: uppercase; text-align: center; display: block; }

        .history-list { display: flex; flex-direction: column; gap: 15px; margin-top: 20px; }
        .history-item { display: flex; align-items: center; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .hist-cover { width: 45px; height: 45px; border-radius: 6px; background-size: cover; background-position: center; flex-shrink: 0; }
        .hist-info { display: flex; flex-direction: column; gap: 2px; overflow: hidden; }
        .hist-time { font-size: 0.6rem; color: var(--accent-pink); font-weight: 900; }
        .hist-song { font-size: 0.75rem; color: #eee; font-weight: 700; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .heart-icon { width: 42px; height: auto; margin-right: 15px; flex-shrink: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
        .scoreboard-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .badge { font-size: 0.6rem; font-weight: 900; padding: 4px 8px; border-radius: 3px; text-transform: uppercase; margin-left: auto; }
        
        #news-wire-title { font-size: 1.5rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--accent-pink); margin-bottom: 30px; }
        .news-item { margin-bottom: 30px; border-left: 2px solid rgba(255,0,127,0.3); padding-left: 15px; }
        .news-date { font-size: 0.65rem; color: var(--accent-pink); font-weight: 900; display: block; margin-bottom: 5px; }
        .news-title { font-size: 1rem; font-weight: 900; color: #fff; text-decoration: none; }
    </style>
</head>
<body>
    <div class="hero-view">
        <nav>
            <a href="https://t.me/YourEurovision" class="logo-container">
                <img src="https://www.eurovision.com/static/images/70-heart-sm.ff9bba532601.webp" class="logo-70">
                <h1 class="logo">Your<span>Eurovision</span> / 2026</h1>
            </a>
            <div id="clock">RIGA: 00:00:00</div>
        </nav>

        <div class="layout">
            <aside class="column">
                <div class="card">
                    <div class="section-title">On Air <span class="live-badge">LIVE</span></div>
                    <div id="player-cover" class="player-cover"></div>
                    <span class="player-artist" id="radio-artist">YourVision</span>
                    <span class="player-song" id="radio-song">Radio</span>
                    
                    <div class="timer-container">
                        <div class="progress-bg"><div id="progress-bar" class="progress-bar"></div></div>
                        <span id="timer-text" class="timer-text">Est. time to end: --:--</span>
                    </div>

                    <div class="main-controls">
                        <button id="toggle-play" class="play-btn"><svg viewBox="0 0 24 24" width="24"><path d="M8 5v14l11-7z"/></svg></button>
                    </div>
                    <input type="range" id="volume-slider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
                    <a href="https://myradio24.com/ru/table/levdanskiy" target="_blank" class="order-btn">Order Song</a>
                    <audio id="audio-stream"></audio>
                </div>
                <div class="card"><div class="section-title">Recently Played</div><div id="history-list" class="history-list"></div></div>
            </aside>

            <main class="column">
                <div class="card">
                    <div class="section-title" style="border-color: var(--accent-cyan); font-size: 1.2rem;">YOURVISION <span style="color:var(--accent-pink);">CUP</span> / 2026</div>
                    <div id="scoreboard-body"></div>
                    <div class="section-title" style="margin-top:40px; border-color:var(--accent-cyan);">Second Chance</div>
                    <div id="wildcard-body"></div>
                    <div id="eliminated-section"><div class="section-title" style="margin-top:40px; border-color:var(--text-dim);">Eliminated / RESET</div><div id="eliminated-body"></div></div>
                </div>
            </main>

            <aside class="column"><div class="card"><div id="news-wire-title">News_Wire [10]</div><div id="news-body"></div></div></aside>
        </div>
    </div>

    <script>
        var DATA = {
            qualifiers: [{c: "Georgia", id: "ge"}, {c: "Albania", id: "al"}, {c: "Sweden", id: "se"}, {c: "UK", id: "gb"}, {c: "Greece", id: "gr"}, {c: "Italy", id: "it"}, {c: "Moldova", id: "md"}, {c: "Malta", id: "mt"}, {c: "Finland", id: "fi"}, {c: "Montenegro", id: "me"}],
            wildcards: [{c: "Norway", id: "no"}, {c: "Bulgaria", id: "bg"}, {c: "Germany", id: "de"}, {c: "San Marino", id: "sm"}, {c: "Switzerland", id: "ch"}],
            eliminated: [{c: "Luxembourg", id: "lu"}, {c: "Romania", id: "ro"}, {c: "Lithuania", id: "lt"}, {c: "Croatia", id: "hr"}, {c: "Latvia", id: "lv"}, {c: "Czechia", id: "cz"}, {c: "Ukraine", id: "ua"}, {c: "Estonia", id: "ee"}, {c: "Portugal", id: "pt"}, {c: "Azerbaijan", id: "az"}],
            news: [
                {d: "22.03 | 01:11", t: "📊 WATCH PARTY POLL", u: "https://t.me/YourEurovision/5480"},
                {d: "22.03 | 01:10", t: "📺 ONLINE WATCH PARTY", u: "https://t.me/YourEurovision/5479"},
                {d: "22.03 | 01:09", id: "no", t: "OSLO PRE-PARTY RECAP", u: "https://t.me/YourEurovision/5478"},
                {d: "22.03 | 01:03", t: "🧪 THE RESET ANNOUNCEMENT", u: "https://t.me/YourEurovision/5477"},
                {d: "22.03 | 00:17", t: "🏛 ALMANAC: НИТЬ ЛАЙМЫ", u: "https://t.me/almanac_marginalia/5"},
                {d: "21.03 | 18:00", t: "🥐 ALMANAC: КАРДАМОН", u: "https://t.me/almanac_marginalia/4"},
                {d: "21.03 | 09:00", t: "🏛 ALMANAC: ДЕНЬ ПОЭЗИИ", u: "https://t.me/almanac_marginalia/3"},
                {d: "21.03 | 18:50", id: "me", t: "TAMARA ZIVKOVIC LIVE", u: "https://www.youtube.com/watch?v=2o46kihDYms"},
                {d: "21.03 | 11:05", t: "📊 ИТОГИ ГРУППЫ E", u: "https://t.me/YourEurovision/5470"},
                {d: "21.03 | 20:00", id: "hr", t: "🧬 DNA: CROATIA - LELEK", u: "https://t.me/YourEurovision/5471"}
            ]
        };

        function getHeartUrl(id) { return `https://www.eurovision.com/static/images/flags/flag_${id}.svg`; }

        function render() {
            document.getElementById('scoreboard-body').innerHTML = DATA.qualifiers.map(q => `<div class="scoreboard-row"><img src="${getHeartUrl(q.id)}" class="heart-icon"><b>${q.c.toUpperCase()}</b><span class="badge badge-qualified">Qualified</span></div>`).join('');
            document.getElementById('wildcard-body').innerHTML = DATA.wildcards.map(w => `<div class="scoreboard-row"><img src="${getHeartUrl(w.id)}" class="heart-icon"><b>${w.c.toUpperCase()}</b><span class="badge badge-second">2nd Chance</span></div>`).join('');
            document.getElementById('eliminated-body').innerHTML = DATA.eliminated.map(e => `<div class="scoreboard-row" style="opacity:0.5;"><img src="${getHeartUrl(e.id)}" class="heart-icon" style="filter:grayscale(100%);"><b>${e.c.toUpperCase()}</b><span class="badge" style="background:#444;">Eliminated</span></div>`).join('');
            document.getElementById('news-body').innerHTML = DATA.news.map(n => `<div class="news-item"><span class="news-date">${n.d}</span><a href="${n.u}" target="_blank" class="news-title">${n.t}</a></div>`).join('');
        }

        var audio = document.getElementById('audio-stream');
        var cover = document.getElementById('player-cover');
        var progressBar = document.getElementById('progress-bar');
        var timerText = document.getElementById('timer-text');
        
        var songDuration = 0;
        var songStartedAt = 0;
        var currentSongId = "";

        const playBtn = document.getElementById('toggle-play');
        playBtn.onclick = () => { 
            if (audio.paused) { 
                audio.src = "https://live.myradio24.com/levdanskiy?nocache="+Date.now(); 
                audio.play(); 
                playBtn.innerHTML='<svg viewBox="0 0 24 24" width="24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>'; 
            } else { 
                audio.pause(); 
                playBtn.innerHTML='<svg viewBox="0 0 24 24" width="24"><path d="M8 5v14l11-7z"/></svg>'; 
            } 
        };
        document.getElementById('volume-slider').oninput = (e) => audio.volume = e.target.value;

        async function syncRadio() {
            try {
                const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://myradio24.com/users/levdanskiy/status.json?v=' + Date.now()));
                const data = JSON.parse((await res.json()).contents);
                const current = data.songs && data.songs.length ? data.songs[data.songs.length-1] : null;
                if (!current) return;

                if (currentSongId !== current.songid) {
                    currentSongId = current.songid;
                    songStartedAt = Date.now();
                    document.getElementById('radio-artist').innerText = current.song.split(' - ')[0];
                    document.getElementById('radio-song').innerText = current.song.split(' - ')[1];
                    const img = current.img.includes('nocover') ? 'https://www.eurovision.com/static/images/70-heart-sm.ff9bba532601.webp' : 'https://myradio24.com/' + current.img;
                    cover.style.backgroundImage = `url('${img}')`;
                    
                    // Fetch duration from iTunes
                    const itunes = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(current.song)}&entity=song&limit=1`);
                    const itData = await itunes.json();
                    songDuration = itData.results[0] ? itData.results[0].trackTimeMillis : 180000; // Default 3 min
                }

                document.getElementById('history-list').innerHTML = data.songs.slice().reverse().slice(0,10).map(h => `
                    <div class="history-item">
                        <div class="hist-cover" style="background-image:url('https://myradio24.com/${h.img}')"></div>
                        <div class="hist-info"><span class="hist-time">${h.time}</span><span class="hist-song">${h.song}</span></div>
                    </div>
                `).join('');
            } catch(e) {}
        }

        function updateTimer() {
            document.getElementById('clock').innerText = "RIGA: " + new Date().toLocaleTimeString('ru-RU');
            if (songDuration > 0) {
                const passed = Date.now() - songStartedAt;
                const remaining = Math.max(0, songDuration - passed);
                const pct = Math.min(100, (passed / songDuration) * 100);
                progressBar.style.width = pct + "%";
                
                const m = Math.floor(remaining / 60000);
                const s = Math.floor((remaining % 60000) / 1000);
                timerText.innerText = `Est. time to end: ${m}:${s < 10 ? '0' : ''}${s}`;
            }
        }

        setInterval(updateTimer, 1000); setInterval(syncRadio, 5000);
        render(); syncRadio();
    </script>
</body>
</html>
